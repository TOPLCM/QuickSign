name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python 语法检查
        run: |
          echo "=== Python 语法检查 ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" | while read f; do
            python -m py_compile "$f" && echo "✅ $f" || echo "❌ $f"
          done

      - name: Shell 语法检查
        run: |
          echo "=== Shell 语法检查 ==="
          find . -name "*.sh" -not -path "./.git/*" | while read f; do
            bash -n "$f" && echo "✅ $f" || echo "❌ $f"
          done

      - name: 安装代码质量工具
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: flake8 代码风格检查
        run: |
          echo "=== flake8 检查 ==="
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,.venv || true
          echo "---"
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=.git,.venv

      - name: 检查敏感文件是否被提交
        run: |
          echo "=== 敏感文件检查 ==="
          SENSITIVE=$(git ls-files | grep -E "config\.(json|yaml)|credentials|cookies|token_cache|\.key$|\.pem$" || true)
          if [ -n "$SENSITIVE" ]; then
            echo "❌ 发现敏感文件被跟踪:"
            echo "$SENSITIVE"
            exit 1
          else
            echo "✅ 无敏感文件被提交"
          fi

  check-scripts:
    name: 签到脚本冒烟测试
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install requests pyyaml

      - name: 验证脚本可导入
        run: |
          echo "=== 脚本导入测试 ==="
          find . -name "signin_direct.py" -not -path "./.git/*" | while read f; do
            dir=$(dirname "$f")
            echo "检查 $f..."
            python -c "import ast; ast.parse(open('$f').read()); print('  ✅ 语法OK')"
          done
